name: Bug report
description: Something in Miware doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open …
        2. Tap …
        3. …
  - type: input
    id: version
    attributes:
      label: Miware version
      description: Check Settings > About or the release you installed.
      placeholder: "v0.3.0-miware"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android TV / OS version
      placeholder: "e.g. Xiaomi Mi Box S Gen 3, Android TV 14"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host on the PC
      placeholder: "e.g. Vibepollo, Apollo, Sunshine"
  - type: input
    id: controller
    attributes:
      label: Controller / Peripheral (if involved)
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Settings you changed, screenshots, or whether Starwire / Moonlight does the same.
