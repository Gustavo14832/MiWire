name: Feature idea
description: Something you'd like MiWire to do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and how you'd use it on Android TV / Mi Box S Gen 3.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Does Starwire or another Moonlight app already have it?
      description: If so, which one (a link helps). MiWire can often port or adapt it.
